[package]
name = "veltrix-agent"
version = "0.2.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3"
machine-uid = "0.5"
screenshots = "0.8"
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25"
base64 = "0.22"
walkdir = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
